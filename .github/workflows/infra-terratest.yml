name: Infra - Terratest

on:
  push:
    branches: [ "001-patient-admin" ]
  pull_request:
    branches: [ "main", "001-patient-admin" ]
  workflow_dispatch:

jobs:
  terratest:
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.6
      - name: Install dependencies
        run: |
          cd infra/terratest
          go mod download
      - name: Run Terratest (requires AWS creds)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
        run: |
          cd infra/terratest
          go test -v ./... -run TestFhirInfra_EncryptionAndPolicies
