name: Infra Terratest (PR dry-run)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.5

      - name: Terraform init (no backend)
        working-directory: infra
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: infra
        run: terraform validate || true

      - name: Run static checks (go vet)
        working-directory: infra/terratest
        run: go vet ./... || true

      - name: Run Terratest smoke (non-blocking)
        working-directory: infra/terratest
        env:
          # Use a signal to indicate this is a dry-run (tests SHOULD be written to handle this)
          TERRATEST_DRY_RUN: "true"
        run: |
          echo "Running non-blocking terratest smoke tests (may skip AWS-dependent tests)."
          go test ./... -run TestTerrtestRunnerRole -timeout 10m || echo "Terratest dry-run failed; continuing (non-blocking)"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terratest-pr-logs
          path: infra/terratest/*.log || true

      - name: Comment PR (summary)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Infra PR dry-run completed (terraform validate + non-blocking terratest smoke). If you need a full integration run against a dev account, request it using the "Run Terratest in Dev" workflow and obtain Security sign-off.`
            })
