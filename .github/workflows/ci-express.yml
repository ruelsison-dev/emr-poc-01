name: CI - Express API

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: backend/express-api
        run: npm ci
      - name: Lint
        working-directory: backend/express-api
        run: npm run lint
      - name: Run tests
        working-directory: backend/express-api
        run: npm test
      - name: Run Snyk (optional)
        if: ${{ secrets.SNYK_TOKEN != '' }}
        run: snyk test
